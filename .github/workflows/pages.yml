name: Publish guide to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.72.0
          locked: true
      - name: Test the guide
        run: pixi run --locked test
      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the production site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: pixi run --locked build --baseURL "${PAGES_BASE_URL%/}/"
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
