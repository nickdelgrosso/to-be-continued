{{ $ui := hugo.Data.interface }}
<div class="appearance" aria-label="{{ $ui.appearance }}" role="group">
  <label for="persona">{{ $ui.persona }}</label>
  <select id="persona" data-js disabled>{{ range hugo.Data.personas.items }}<option value="{{ .id }}" {{ if eq .id hugo.Data.personas.default }}selected{{ end }} {{ with resources.Get .illustration | fingerprint }}data-art="{{ .RelPermalink }}"{{ end }}>{{ .label }}</option>{{ end }}</select>
  {{ partial "colour-mode.html" $ui }}
</div>
