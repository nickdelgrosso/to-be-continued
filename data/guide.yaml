formatVersion: 1
documentTitle: Research Code Handover

introduction:
  title: What would you tell the next researcher?
  paragraphs:
    - Start with something they couldn’t find in the files. A decision you made over coffee or a plot you always check is enough. Skip any prompt and download your notes to keep with the code.

project:
  title: Project details
  fields:
    - id: title
      label: Project title
      exportLabel: Project
      placeholder: e.g. Meadow survey analysis
    - id: repository
      label: Repository URL
      exportLabel: Repository
      placeholder: https://…
      inputmode: url
    - id: contributor
      label: Author or contributor
      exportLabel: Contributor
      placeholder: Your name or research group
    - id: version
      label: Date or project version
      exportLabel: Date or version
      placeholder: e.g. Autumn 2026 or v1.2

chapters:
  - id: story
    number: I
    title: The story so far
    subtitle: Project context, history and people
    intro: What happened before this handover?
    accent: mustard
    icon: book
    questions:
      - purpose
      - decisions
      - people
      - next-steps

  - id: lessons
    number: II
    title: Lessons from the field
    subtitle: Maintenance, troubleshooting and learning
    intro: Which lessons cost you time?
    accent: brown
    icon: notebook
    questions:
      - troubleshooting
      - fragile-parts
      - hindsight

  - id: verification
    number: III
    title: Proceed with care
    subtitle: Verification, reliability and safety
    intro: Help a colleague spot a result that looks right but isn’t.
    accent: brick
    icon: shield
    questions:
      - trust-checks
      - reference-results
      - misleading-results
      - consequences

  - id: workflow
    number: IV
    title: A day in the life
    subtitle: Workflow and everyday use
    intro: Take someone through a real working day.
    accent: orange
    icon: cup
    questions:
      - typical-session
      - manual-steps
      - regular-tools

  - id: internals
    number: V
    title: Under the hood
    subtitle: Understanding and adapting the code
    intro: Leave signposts for the next person editing the code.
    accent: tobacco
    icon: compass
    questions:
      - reading-order
      - vocabulary
      - adaptation

  - id: setup
    number: VI
    title: Getting started
    subtitle: Getting the code running
    intro: Give someone a small first run they can repeat.
    accent: olive
    icon: key
    questions:
      - first-run
      - resources
      - setup-assumptions

# Group questions above by moving their IDs. Keep IDs stable when editing the wording below.
questions:
  purpose:
    text: What question did you build this code to answer?
    help: Include a question your analysis can’t answer.
    example: We built this to compare flowering dates across our meadow plots. We only sampled in spring, so it tells us very little about late-flowering species.
  decisions:
    text: Which decision best explains why the code looks this way?
    references:
      - Link to the change if you have it. Say what you tried first and why you moved on.
  people:
    text: Who should the next researcher speak to?
    references:
      - Mention who relies on the results, who needs credit and any promises you made.
  next-steps:
    text: What would you try next?
    help: A loose end is a good place for someone to pick up the work.

  typical-session:
    text: How do you get from raw data to a result you keep?
    references:
      - If a Pixi task, Makefile, Snakemake or Nextflow workflow already describes the sequence, name it and explain the decisions you make around it.
  manual-steps:
    text: Which steps do you do by hand?
    example: I compare the station names against the field notebook before merging the tables. Two stations changed names in 2022.
  regular-tools:
    text: Which scripts or commands do you actually use?
    help: Flag old scripts that still look current.

  first-run:
    text: How can someone get a first result?
    help: Name a small input they can start with and something they should see when it works.
    references:
      - A reference to your README, `pixi.toml`, `pyproject.toml`, `uv.lock` or `environment.yml` may be enough. Add anything someone would still need to know.
  resources:
    text: What does someone need access to before starting?
    help: Mention datasets, equipment or permissions and how to get them. Keep passwords and private access links out of your notes.
  setup-assumptions:
    text: What catches people out during setup?
    example: The notebook looks for the data folder next to itself. Opening it from the project root gives a confusing file error.

  reading-order:
    text: Which file should someone read first?
    help: A path and a few words about why it matters can save someone an afternoon.
  vocabulary:
    text: Which names, units or dimensions need explaining?
    example: In the observation array, the second dimension is a repeat visit to the same plot. It is easy to mistake those visits for independent samples.
    references:
      - Names and type annotations can describe a structure. Explain what its dimensions, units or categories mean in the research.
  adaptation:
    text: What would you change first for a new dataset?
    help: Point to a sensible starting point and an assumption worth checking first.

  trust-checks:
    text: How do you tell whether a result makes sense?
    example: I normally check that the control group shows no systematic response. If it does, I investigate the timestamp preprocessing before changing the analysis.
    references:
      - Include a check you make by eye or using your knowledge of the research.
  reference-results:
    text: Which result should someone try to reproduce?
    help: Name the file, figure or test and describe what a reasonable match looks like.
  misleading-results:
    text: When can a successful run give a misleading result?
    example: I don't know whether this works with newer datasets. The sensor changed after our last field season.
  consequences:
    text: What needs care before someone changes or shares it?
    help: Think about original observations, private data, costly jobs and scripts that overwrite their inputs.

  troubleshooting:
    text: Which error have you already spent time chasing?
    help: Knowing when something happens can help someone investigate, even if the cause is still a mystery.
  fragile-parts:
    text: Which part still feels fragile?
    example: I never managed to establish why the last two plots swap order on some machines. I check their labels against the table by hand.
  hindsight:
    text: What do you wish you’d known at the start?
    help: This can be about the data, the people or the research itself as much as the code.
